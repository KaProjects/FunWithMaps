<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src blob:; child-src blob:; img-src 'self' data: blob: https://tiles.openfreemap.org; connect-src https://tiles.openfreemap.org" />
  <title>Timeline Map</title>
  <link rel="stylesheet" href="vendor/maplibre-gl.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="map"></div>

  <div id="drag-bar"></div>

  <aside id="panel" hidden>
    <header class="panel-head">
      <h1>Timeline Map</h1>
      <button id="toggle" class="toggle" title="Hide controls" aria-expanded="true">&laquo;</button>
    </header>

    <div class="panel-body">
    <p id="total" class="total"></p>

    <fieldset id="kinds">
      <legend>Layers</legend>
      <!-- filled by app.js -->
    </fieldset>

    <label class="row">
      <span>Dot size</span>
      <input id="size" type="range" min="0.4" max="3" step="0.1" value="1" />
    </label>

    <label class="row">
      <span>Basemap</span>
      <select id="basemap">
        <option value="dark">Dark</option>
        <option value="positron">Light</option>
        <option value="liberty" selected>Detailed</option>
        <option value="bright">Bright</option>
        <option value="aoe">AOE</option>
        <option value="euiv">EUIV</option>
      </select>
    </label>

    <label class="row check">
      <input id="labels" type="checkbox" checked />
      <span>Place names</span>
    </label>

    <label class="row check">
      <input id="fog" type="checkbox" />
      <span>Terra incognita</span>
    </label>
    <label class="row" id="reveal-row" hidden>
      <span>Reveal</span>
      <input id="reveal" type="range" min="200" max="100000" step="200" value="20000" />
      <output id="reveal-value" class="value">20 km</output>
    </label>

    <label class="row check">
      <input id="globe" type="checkbox" />
      <span>Globe projection</span>
    </label>

    <div class="buttons">
      <button id="fit">Fit dots</button>
      <button id="world">World</button>
      <button id="open">Open file…</button>
    </div>

    <p id="status" class="status"></p>
    </div>
  </aside>

  <div id="splash">
    <div class="splash-inner">
      <h2 id="splash-title">Reading your Timeline…</h2>
      <p id="splash-body">Looking for <code>Timeline.json</code> next to the app.</p>
      <button id="splash-open" hidden>Choose a file…</button>
      <p id="splash-hint" class="hint" hidden>…or drop the JSON file anywhere on this window.</p>
    </div>
  </div>

  <script src="vendor/maplibre-gl.js"></script>
  <script src="basemaps.js"></script>
  <script src="fog.js"></script>
  <script src="app.js"></script>
</body>
</html>
